<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#101014"><title>SUBLY — Administration</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#f7f7f8;font-family:Arial,sans-serif;padding:22px} .wrap{max-width:1050px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}h1{font-size:25px;margin:0}h1 span{color:#ff8a24}.muted{color:#aaa;font-size:13px}.panel{background:#1b1b21;border:1px solid #303039;border-radius:16px;padding:20px;margin:14px 0}input,select,button{font:inherit;border-radius:10px;padding:13px;border:1px solid #3a3a44}input{display:block;width:100%;background:#111116;color:white;margin:8px 0 14px}button{background:#ff8a24;color:#17120d;font-weight:bold;border:0;cursor:pointer}button.secondary{background:#303039;color:white}button:disabled{opacity:.5}.login{max-width:430px;margin:10vh auto}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#24242c;border-radius:12px;padding:14px}.stat b{display:block;font-size:22px;margin-top:8px}.order{border-top:1px solid #35353d;padding:16px 0}.order:first-child{border:0}.order h3{margin:0 0 8px;font-size:16px}.order p{margin:5px 0;color:#ccc;font-size:14px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.controls select{background:#111116;color:white;flex:1;min-width:135px}.small{font-size:12px;color:#aaa}.error{color:#ff8b8b}.success{color:#8ce0a3}.top-actions{display:flex;gap:8px}a{color:#ff9b43}@media(max-width:600px){body{padding:14px}.stats{grid-template-columns:1fr 1fr}header{align-items:flex-start}h1{font-size:21px}}
</style>
</head><body><main class="wrap">
<section id="loginPanel" class="panel login"><h1><span>SUBLY</span> Admin</h1><p class="muted">Connecte-toi avec le compte administrateur créé dans Supabase.</p><form id="loginForm"><label>Adresse e-mail</label><input id="email" type="email" autocomplete="username" required><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" type="submit" style="width:100%">Se connecter</button></form><p id="loginMessage" class="small"></p></section>
<section id="dashboard" class="hidden"><header><div><h1><span>SUBLY</span> — Commandes</h1><p class="muted">Espace administrateur sécurisé</p></div><div class="top-actions"><button class="secondary" id="refreshBtn">Actualiser</button><button class="secondary" id="logoutBtn">Déconnexion</button></div></header>
<div class="stats"><div class="stat"><span class="muted">Commandes</span><b id="count">0</b></div><div class="stat"><span class="muted">En attente</span><b id="pending">0</b></div><div class="stat"><span class="muted">Montant total</span><b id="amount">0</b></div></div>
<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0;font-size:18px">Toutes les commandes</h2><select id="filter" style="background:#111116;color:white"><option value="À traiter">À traiter</option><option value="En cours">En cours</option><option value="Terminée">Terminées / Traitées</option><option value="all">Toutes les commandes</option></select></div><p id="loadMessage" class="muted">Chargement…</p><div id="orders"></div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://eoznkizamxmujvcmxyaf.supabase.co';
const SUPABASE_KEY='sb_publishable_6ClWz5Cc_YQ2bGt_qSxWHw_9Wydo9g6';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let allOrders=[];
const money=n=>Number(n||0).toLocaleString('fr-FR')+' FCFA';
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;$('loginMessage').textContent='Connexion…';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){$('loginMessage').className='small error';$('loginMessage').textContent='Connexion impossible : '+error.message;return;}await showDashboard();});
async function showDashboard(){const {data:{session}}=await db.auth.getSession();if(!session)return;$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadOrders();}
async function loadOrders(){$('loadMessage').textContent='Chargement des commandes…';const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){$('loadMessage').className='error';$('loadMessage').textContent='Erreur : '+error.message;return;}allOrders=data||[];$('count').textContent=allOrders.length;$('pending').textContent=allOrders.filter(o=>String(o.payment_status||'').toLowerCase().includes('attente')||String(o.payment_status||'').toLowerCase().includes('vérifier')).length;$('amount').textContent=money(allOrders.reduce((s,o)=>s+Number(o.total||0),0));renderOrders();$('loadMessage').textContent=allOrders.length?'':'Aucune commande pour le moment.';}
function renderOrders(){const filter=$('filter').value;const list=allOrders.filter(o=>filter==='all'||(o.order_status||'À traiter')===filter);$('orders').innerHTML=list.map(o=>{const items=Array.isArray(o.items)?o.items:[];const done=(o.order_status||'')==='Terminée';const controls=done?`<div class="controls"><span class="success" style="font-weight:bold;align-self:center">✓ Commande traitée — ${esc(o.payment_status||'Paiement non renseigné')}</span><button class="secondary" onclick="undoOrder(${o.id})">Annuler le traitement</button></div>`:`<div class="controls"><select id="pay-${o.id}"><option ${o.payment_status==='Paiement en attente de vérification'?'selected':''}>Paiement en attente de vérification</option><option ${o.payment_status==='Payé'?'selected':''}>Payé</option><option ${o.payment_status==='Paiement refusé'?'selected':''}>Paiement refusé</option></select><select id="status-${o.id}"><option ${o.order_status==='À traiter'?'selected':''}>À traiter</option><option ${o.order_status==='En cours'?'selected':''}>En cours</option><option ${o.order_status==='Terminée'?'selected':''}>Terminée</option></select><button onclick="saveOrder(${o.id})">Enregistrer</button></div>`;return `<article class="order"><h3>${esc(o.reference||'Commande')} — ${money(o.total)}</h3><p><b>Client :</b> ${esc(o.customer_name||'—')}</p><p><b>Téléphone :</b> ${esc(o.customer_phone||'—')}</p><p><b>E-mail :</b> ${esc(o.customer_email||'Non renseigné')}</p><p><b>Articles :</b> ${items.map(i=>esc(i.service)+' / '+esc(i.plan)+' ('+esc(i.duration)+' mois)').join(', ')||'—'}</p><p><b>Reçue le :</b> ${o.created_at?new Date(o.created_at).toLocaleString('fr-FR'):'—'}</p>${controls}</article>`}).join('')||'<p class="muted">Aucune commande pour ce filtre.</p>';}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
window.saveOrder=async id=>{const payment_status=$('pay-'+id).value,order_status=$('status-'+id).value;const button=document.querySelector(`button[onclick="saveOrder(${id})"]`);if(button){button.disabled=true;button.textContent='Enregistrement…';}const {data,error}=await db.from('orders').update({payment_status,order_status}).eq('id',id).select('id,order_status,payment_status').maybeSingle();if(error){if(button){button.disabled=false;button.textContent='Enregistrer';}alert('Modification impossible : '+error.message);return;}if(!data){if(button){button.disabled=false;button.textContent='Enregistrer';}alert('Aucune ligne modifiée. Vérifie la connexion administrateur Supabase.');return;}await loadOrders();if(order_status==='Terminée'){$('filter').value='À traiter';renderOrders();alert('Commande enregistrée et retirée automatiquement des commandes à traiter. Elle se trouve dans « Terminées / Traitées ».');}else{alert('Commande mise à jour.');}};
window.undoOrder=async id=>{if(!confirm('Annuler le traitement de cette commande ? Elle reviendra dans « À traiter ».'))return;const {data,error}=await db.from('orders').update({order_status:'À traiter'}).eq('id',id).select('id,order_status').maybeSingle();if(error){alert('Annulation impossible : '+error.message);return;}if(!data){alert('Aucune commande modifiée. Vérifie la connexion administrateur.');return;}await loadOrders();$('filter').value='À traiter';renderOrders();alert('Traitement annulé. La commande est revenue dans « À traiter ».');};
$('refreshBtn').onclick=loadOrders;$('filter').onchange=renderOrders;$('logoutBtn').onclick=async()=>{await db.auth.signOut();$('dashboard').classList.add('hidden');$('loginPanel').classList.remove('hidden');};
db.auth.getSession().then(({data})=>{if(data.session)showDashboard();});
</script></body></html>
